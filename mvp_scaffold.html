<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Remix — Client-side Meme Generator (MVP)</title>
  <style>body{font-family:Arial;display:flex;flex-direction:column;align-items:center;padding:16px}canvas{border:1px solid #ccc}</style>
</head>
<body>
  <h1>Remix (MVP)</h1>
  <input id="imgIn" type="file" accept="image/*" />
  <canvas id="c" width="800" height="600"></canvas>
  <div>
    <input id="text" placeholder="Add overlay text" />
    <button id="addText">Add Text</button>
    <button id="export">Export & Share</button>
  </div>
<script>
const imgIn=document.getElementById('imgIn');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let baseImage=null;
imgIn.addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f) return;
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    canvas.width=Math.min(1200,img.width);
    canvas.height=img.height*(canvas.width/img.width);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    baseImage=img;
    URL.revokeObjectURL(url);
  };
  img.src=url;
});

document.getElementById('addText').onclick=()=>{
  const t=document.getElementById('text').value.trim();
  if(!t) return;
  ctx.font='48px Impact, Arial';
  ctx.fillStyle='white';
  ctx.strokeStyle='black';
  ctx.lineWidth=6;
  ctx.textAlign='center';
  ctx.fillText(t, canvas.width/2, 80);
  ctx.strokeText(t, canvas.width/2, 80);
};

document.getElementById('export').onclick=async()=>{
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  // Simple zero-cost share: attempt Web Share API, else create object URL
  if(navigator.canShare && navigator.canShare({files:[new File([blob],'remix.png',{type:'image/png'})]})){
    try{
      await navigator.share({files:[new File([blob],'remix.png',{type:'image/png'})], title:'My Remix'});
      return;
    }catch(e){/* fall back */}
  }
  const url=URL.createObjectURL(blob);
  // Optionally call Link Service to persist: POST /links -> {short}
  // fetch('/links',{method:'POST',body:...})
  const win=window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
};
</script>
</body>
</html>
